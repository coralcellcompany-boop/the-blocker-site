 ru:{c:"Проверяем…",cb:"Проверяем, использует ли Safari The Blocker.",on:"Блокировка ВКЛЮЧЕНА",onb:"Safari использует The Blocker. Вы защищены.",off:"Блокировка ВЫКЛЮЧЕНА",offb:"Safari пока не использует The Blocker.",s1:"Откройте Настройки ▸ Приложения ▸ Safari ▸ Расширения.",s2:"Выберите <b>The Blocker</b> и включите <b>Разрешить расширение</b>.",s3:"Вернитесь сюда и повторите проверку.",net:"Сейчас проверить нельзя",netb:"Похоже, нет подключения к интернету. Подключитесь и попробуйте снова.",rv:"Если The Blocker вам помогает, ваша оценка поможет найти его тому, кому он нужен. Она публикуется под выбранным вами псевдонимом, а не под вашим именем.",btn:"Оценить The Blocker"},

var q = new URLSearchParams(location.search);
var code = (q.get("lang") || (navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase().slice(0, 2);
var L = T[code] || T.en;
document.documentElement.lang = code;
if (code === "ar") document.documentElement.dir = "rtl";
document.getElementById("t").textContent = L.c;
document.getElementById("b").textContent = L.cb;

function load(src){return new Promise(function(ok){var s=document.createElement('script');
  s.src=src+'?t='+Date.now();s.onload=function(){ok(true)};s.onerror=function(){ok(false)};document.head.appendChild(s);});}
function show(cls,icon,title,body){var r=document.getElementById('result');r.className=cls;
  r.innerHTML='<div class="icon">'+icon+'</div><h1>'+title+'</h1>'+body;}
function render(state){
  if (state === "net") show('unknown','📶',L.net,'<p>'+L.netb+'</p>');
  // Success is the moment to ask for a rating: the user just saw it work.
  else if (state === "on") show('on','✅',L.on,'<p>'+L.onb+'</p>'+(q.get("from") === "app" ? '' :
    '<div class="review"><p>⭐ '+L.rv+'</p><a class="btn" href="'+REVIEW_URL+'">'+L.btn+'</a></div>'));
  else show('off','⚠️',L.off,'<p>'+L.offb+'</p><ol><li>'+L.s1+'</li><li>'+L.s2+'</li><li>'+L.s3+'</li></ol>');
}
if (q.get("preview")) render(q.get("preview"));
else Promise.all([load('control.js'),load('probe.js')]).then(function(v){
  render(!v[0] ? "net" : (!v[1] ? "on" : "off"));
});
</script>
